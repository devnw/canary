# Canary - GitLab CI/CD Configuration
# Uses devnw/ci-catalog components for standardized Go CI/CD
# Follows the same pattern as void (codepros/oss/void) with apt deployment

stages:
  - build
  - test
  - lint
  - security
  - release
  - publish

variables:
  # go.mod requires Go >= 1.27.0. CI runs the golang:$GO_VERSION image with
  # GOTOOLCHAIN=local, so the image Go must satisfy that floor.
  GO_VERSION: "1.27"

# Route jobs to the OVH Dedicated Runners pool. The bare `company` tag also
# matches the Hosted Windows Runners pool [company, windows, dedicated, x86],
# which has no Go toolchain and runs PowerShell — a bare-tagged go-build
# landed there and failed with "go: not recognized" (pipeline 2801146876).
# `[company, dedicated, linux]` uniquely selects OVH Dedicated (Lab Servers
# lacks `dedicated`, Company Cluster lacks `dedicated`, Windows lacks
# `linux`). Same routing rationale as void's .gitlab-ci.yml.
default:
  tags:
    - company
    - dedicated
    - linux

include:
  # Build stage
  - component: gitlab.com/devnw/ci-catalog/go-build@v1.43.0
    inputs:
      stage: build
      go_version: $GO_VERSION
      build_flags: "-v"

  # Test stage
  - component: gitlab.com/devnw/ci-catalog/go-test@v1.43.0
    inputs:
      stage: test
      go_version: $GO_VERSION
      test_flags: "-race -coverprofile=coverage.out -covermode=atomic"
      coverage_report: true

  # Lint stage
  - component: gitlab.com/devnw/ci-catalog/go-lint@v1.43.0
    inputs:
      stage: lint
      # v2.13+ is built with go1.27; older images refuse go 1.27 modules
      golangci_version: "v2.13.2"
      lint_flags: "--timeout 5m"
      config_file: ".golangci.yml"
      allow_failure: false

  # Security scanning - gosec
  - component: gitlab.com/devnw/ci-catalog/gosec@v1.43.0
    inputs:
      stage: security
      allow_failure: false

  # Security scanning - govulncheck
  - component: gitlab.com/devnw/ci-catalog/govulncheck@v1.43.0
    inputs:
      stage: security
      allow_failure: false

  # Release stage - goreleaser
  - component: gitlab.com/devnw/ci-catalog/goreleaser-release@v1.43.0
    inputs:
      stage: release
      # v2.6.1 predates .goreleaser.yaml's dockers.retry and homebrew_casks
      goreleaser_version: "v2.18.0"
      docker_enabled: true
      dockerhub_enabled: false
      dockerhub_image: codeprosorg/canary
      tag_only: true

  # APT repository publishing (apt.codepros.org)
  - component: gitlab.com/devnw/ci-catalog/apt-publish@v1.43.0
    inputs:
      stage: publish
      apt_domain: apt.codepros.org
      job_suffix: apt-codepros-org
      vault_auth_role: codepros-ci
      vault_mount: devnw
      vault_secret_path: codepros/oss/apt
      package_path: dist/*.deb
      gpg_key_name: canary.gpg
      sign_needs: goreleaser-release
      allow_failure: false

# Evidence-backed requirement verification. Declarations (STATUS=TESTED,
# TEST=...) prove nothing on their own: this job runs the test suite, turns
# the passing tests into evidence records bound to this commit, ingests them,
# and only then asks whether GAP_ANALYSIS.md's claims hold. The project key
# is hardcoded to this repo's .canary/project.yaml project.key.
canary-verify:
  stage: test
  image: golang:$GO_VERSION
  script:
    - go build -o bin/canary ./cmd/canary
    - go test -count=1 -json ./... > gotest.json
    - COMMIT=$(git rev-parse HEAD)
    - ./bin/canary evidence from-go-test --project CBIN --commit "$COMMIT" < gotest.json > evidence.json
    - ./bin/canary evidence ingest --in evidence.json --out .canary/evidence.json
    - ./bin/canary verify --root . --claims GAP_ANALYSIS.md --project CBIN --format json
    - ./bin/canary scan --root . --out status.json
    # The tree must be clean: verification reads the repo, it never edits it.
    - git diff --exit-code
  artifacts:
    when: always
    paths:
      - evidence.json
      - status.json

# Override the govulncheck scanner image so the stdlib it analyzes tracks the
# module's Go version rather than the (lagging) ci-catalog go image. Same
# rationale as void's override.
govulncheck:
  image: golang:1.27

# Override goreleaser-release: run goreleaser DIRECTLY in the job container
# instead of the catalog's nested `docker run goreleaser/goreleaser` pattern.
# The nested pattern fails on these runners because the build dir is a
# runner-managed Docker volume, not host-visible — `-v $PWD:/workspace` mounts
# an empty dir and goreleaser dies with "open .goreleaser.yaml: no such file
# or directory" (canary v0.2.1 pipeline 2801146868, same failure void hit at
# v0.1.27). Ported from void's proven override; canary differences: no
# Homebrew tap, and .goreleaser.yaml templates `dockerfile:` from
# $DOCKERFILE, so it is exported here.
goreleaser-release:
  tags:
    - company
    - dedicated
    - docker
    - linux
  # OVH Dedicated Runners bind-mount /var/run/docker.sock; no dind needed.
  services: []
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://pki.devnw.com
  variables:
    GITHUB_TOKEN: ""
    VAULT_ADDR: https://pki.devnw.com
    VAULT_AUTH_ROLE: codepros-ci
    VAULT_MOUNT: devnw
    VAULT_DOCKERHUB_SECRET_PATH: codepros/oss/dockerhub
    # Force docker CLI to use the host's daemon via the bind-mounted socket.
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKERFILE: "Dockerfile"
    # Alpine's packaged Go (apk add go) lags go.mod's floor; let the
    # toolchain auto-download go1.27.0 for the `go mod tidy` before-hook
    # instead of failing under GOTOOLCHAIN=local.
    GOTOOLCHAIN: "auto"
  before_script:
    - apk add --no-cache curl jq > /dev/null
    - |
      # Unset GITHUB_TOKEN so goreleaser doesn't detect multiple tokens.
      unset GITHUB_TOKEN

      # Authenticate to Vault (Docker Hub credentials; optional)
      if [ -n "$VAULT_AUTH_ROLE" ]; then
        echo "Authenticating to Vault at $VAULT_ADDR..."
        AUTH_RESPONSE=$(curl -sS --request POST \
          --data "{\"role\": \"$VAULT_AUTH_ROLE\", \"jwt\": \"$VAULT_ID_TOKEN\"}" \
          "$VAULT_ADDR/v1/auth/gitlab-jwt/login")
        VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token')
        export VAULT_TOKEN

        if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
          echo "ERROR: Vault authentication failed"
          echo "$AUTH_RESPONSE" | jq .
          exit 1
        fi
        echo "Vault authentication successful"

        if [ -n "$VAULT_DOCKERHUB_SECRET_PATH" ]; then
          echo "Reading Docker Hub secret from: ${VAULT_MOUNT}/data/${VAULT_DOCKERHUB_SECRET_PATH}"
          VAULT_RESPONSE=$(curl -sS --header "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/${VAULT_MOUNT}/data/$VAULT_DOCKERHUB_SECRET_PATH")

          export DOCKERHUB_USERNAME=$(echo "$VAULT_RESPONSE" | jq -r '.data.data.username // empty')
          export DOCKERHUB_TOKEN=$(echo "$VAULT_RESPONSE" | jq -r '.data.data.token // empty')

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "WARNING: Docker Hub credentials not found at expected keys (username, token)"
          else
            echo "Docker Hub credentials loaded for user: $DOCKERHUB_USERNAME"
          fi
        fi
      fi

      # Runner-injected DOCKER_AUTH_CONFIG takes precedence over `docker
      # login`; remove it so the job-scoped credential below is
      # authoritative (see void v0.3.3 trace).
      unset DOCKER_AUTH_CONFIG

      # Job-local DOCKER_CONFIG in /tmp: keeps credentials off the runner
      # host (poisons later jobs) and outside the repo tree (goreleaser
      # dirty-tree check).
      export DOCKER_CONFIG=/tmp/.docker
      mkdir -p "$DOCKER_CONFIG"

      # CI_JOB_TOKEN always has push access to this project's own registry.
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

      # Login to Docker Hub (optional)
      if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "Logging into Docker Hub..."
        echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      else
        echo "WARNING: Skipping Docker Hub login (no credentials)"
      fi
  script:
    - |
      GORELEASER_VERSION_PIN="${GORELEASER_VERSION:-v2.18.0}"
      # Known-good SHA-256 of goreleaser_Linux_x86_64.tar.gz for the pinned
      # version (from the release's checksums.txt). Update in lockstep with
      # GORELEASER_VERSION_PIN — a mismatch fails the job closed.
      GORELEASER_SHA256_v2_6_1="517bc6422ed3fc4ae12900216cdab047dbb1dc60610174a170f7b760f171e27f"
      GORELEASER_SHA256_v2_18_0="41cdf49b653784b03a08013dd99e382cd5d463049e915c2d818eaed182ae6197"

      RELEASE_ARGS="${GORELEASER_RELEASE_ARGS:---clean}"
      RELEASE_ARGS="$RELEASE_ARGS --config .goreleaser.yaml"

      echo "Running GoReleaser with: release $RELEASE_ARGS"

      # GitHub release is disabled via .goreleaser.yaml's
      # `release: disable: {{ index .Env "GITLAB_CI" }}`; no SCM token needed.
      # Drop the catalog's GITLAB_TOKEN default so goreleaser doesn't probe it.
      unset GITLAB_TOKEN

      # go: .goreleaser.yaml's `before:` hook runs `go mod tidy`; the
      # docker:latest job image has no Go toolchain.
      apk add --no-cache go

      # Download goreleaser, verify against the pinned SHA-256, then extract.
      case "$GORELEASER_VERSION_PIN" in
        v2.6.1) GORELEASER_SHA256="$GORELEASER_SHA256_v2_6_1" ;;
        v2.18.0) GORELEASER_SHA256="$GORELEASER_SHA256_v2_18_0" ;;
        *)
          echo "ERROR: no pinned SHA-256 for goreleaser $GORELEASER_VERSION_PIN; add it before releasing." >&2
          exit 1
          ;;
      esac
      GORELEASER_TARBALL="/tmp/goreleaser_Linux_x86_64.tar.gz"
      curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION_PIN}/goreleaser_Linux_x86_64.tar.gz" \
        -o "$GORELEASER_TARBALL"
      echo "${GORELEASER_SHA256}  ${GORELEASER_TARBALL}" | sha256sum -c -
      tar xz -C /usr/local/bin -f "$GORELEASER_TARBALL" goreleaser
      go version
      goreleaser --version

      # Register qemu emulators so the arm64 leg of the multi-arch build can
      # run under emulation (idempotent).
      docker run --rm --privileged tonistiigi/binfmt --install all

      goreleaser release $RELEASE_ARGS

# apt-publish overrides: clear the aws-cli entrypoint and route the apt jobs
# to the k8s Company Cluster pool [company, k8s, linux] — OVH Dedicated fails
# apt GPG verification and Lab Servers fails DNS (see void's .gitlab-ci.yml
# for the full runner history). before_script lines stay single-line: block
# scalars crash the detect-secrets pre-commit YAML parser.
apt-publish-apt-codepros-org:
  tags:
    - company
    - k8s
    - linux
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]

apt-sign-apt-codepros-org:
  tags:
    - company
    - k8s
    - linux
  before_script:
    - "mkdir -p /etc/apt/apt.conf.d"
    - "echo 'Acquire::http::No-Cache \"true\";' > /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::https::No-Cache \"true\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::http::Pipeline-Depth \"0\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::Retries \"3\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::BrokenProxy \"true\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY || true"
    - "apt-get update -qq && apt-get install -qq -y gnupg dpkg-dev curl jq ca-certificates > /dev/null"

apt-repo-apt-codepros-org:
  tags:
    - company
    - k8s
    - linux
  before_script:
    - "mkdir -p /etc/apt/apt.conf.d"
    - "echo 'Acquire::http::No-Cache \"true\";' > /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::https::No-Cache \"true\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::http::Pipeline-Depth \"0\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::Retries \"3\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "echo 'Acquire::BrokenProxy \"true\";' >> /etc/apt/apt.conf.d/99-ciah-no-cache"
    - "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY || true"
    - "apt-get update -qq && apt-get install -qq -y gnupg dpkg-dev xz-utils gzip coreutils curl jq ca-certificates awscli > /dev/null"
