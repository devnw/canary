# Canary - GitLab CI/CD Configuration
# Uses devnw/ci-catalog components for standardized Go CI/CD
# Follows the same pattern as void (codepros/oss/void) with apt deployment

stages:
  - build
  - test
  - lint
  - security
  - release
  - publish

variables:
  GO_VERSION: "1.27"

# Include CI catalog components
default:
  tags:
    - company

include:
  # Build stage
  - component: gitlab.com/devnw/ci-catalog/go-build@v1.11.0
    inputs:
      stage: build
      go_version: $GO_VERSION
      build_flags: "-v"

  # Test stage
  - component: gitlab.com/devnw/ci-catalog/go-test@v1.11.0
    inputs:
      stage: test
      go_version: $GO_VERSION
      test_flags: "-race -coverprofile=coverage.out -covermode=atomic"
      coverage_report: true

  # Lint stage
  - component: gitlab.com/devnw/ci-catalog/go-lint@v1.11.0
    inputs:
      stage: lint
      golangci_version: "v2.8.0"
      lint_flags: "--timeout 5m"
      config_file: ".golangci.yml"
      allow_failure: false

  # Security scanning - gosec
  - component: gitlab.com/devnw/ci-catalog/gosec@v1.11.0
    inputs:
      stage: security
      allow_failure: false

  # Security scanning - govulncheck
  - component: gitlab.com/devnw/ci-catalog/govulncheck@v1.11.0
    inputs:
      stage: security
      allow_failure: false

  # Release stage - goreleaser
  - component: gitlab.com/devnw/ci-catalog/goreleaser-release@v1.11.0
    inputs:
      stage: release
      goreleaser_version: "v2.6.1"
      docker_enabled: true
      dockerhub_enabled: false
      dockerhub_image: codeprosorg/canary
      tag_only: true

  # APT repository publishing (apt.codepros.org)
  - component: gitlab.com/devnw/ci-catalog/apt-publish@v1.14.0
    inputs:
      stage: publish
      apt_domain: apt.codepros.org
      job_suffix: apt-codepros-org
      vault_auth_role: codepros-ci
      vault_mount: devnw
      vault_secret_path: codepros/oss/apt
      package_path: dist/*.deb
      gpg_key_name: canary.gpg
      sign_needs: goreleaser-release
      allow_failure: false

# Override goreleaser-release for SaaS runners and GitLab Container Registry
goreleaser-release:
  tags:
    - company
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://pki.devnw.com
  variables:
    GITHUB_TOKEN: ""
    VAULT_ADDR: https://pki.devnw.com
    VAULT_AUTH_ROLE: codepros-ci
    VAULT_MOUNT: devnw
    VAULT_SECRET_PATH: codepros/oss/dockerhub
  before_script:
    - apk add --no-cache curl jq > /dev/null
    - |
      unset GITHUB_TOKEN

      if [ -n "$VAULT_AUTH_ROLE" ] && [ -n "$VAULT_SECRET_PATH" ]; then
        echo "Authenticating to Vault at $VAULT_ADDR..."
        AUTH_RESPONSE=$(curl -sS --request POST \
          --data "{\"role\": \"$VAULT_AUTH_ROLE\", \"jwt\": \"$VAULT_ID_TOKEN\"}" \
          "$VAULT_ADDR/v1/auth/gitlab-jwt/login")
        VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token')
        export VAULT_TOKEN

        if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
          echo "ERROR: Vault authentication failed"
          echo "$AUTH_RESPONSE" | jq .
          exit 1
        fi
        echo "Vault authentication successful"

        echo "Reading secret from: ${VAULT_MOUNT}/data/${VAULT_SECRET_PATH}"
        VAULT_RESPONSE=$(curl -sS --header "X-Vault-Token: $VAULT_TOKEN" \
          "$VAULT_ADDR/v1/${VAULT_MOUNT}/data/$VAULT_SECRET_PATH")

        export DOCKERHUB_USERNAME=$(echo "$VAULT_RESPONSE" | jq -r '.data.data.username // empty')
        export DOCKERHUB_TOKEN=$(echo "$VAULT_RESPONSE" | jq -r '.data.data.token // empty')

        if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
          echo "WARNING: Docker Hub credentials not found"
        else
          echo "Docker Hub credentials loaded for user: $DOCKERHUB_USERNAME"
        fi
      fi

      docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "$DOCKER_REGISTRY"

      if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      fi
  script:
    - |
      GORELEASER_IMAGE="goreleaser/goreleaser:${GORELEASER_VERSION:-v2.6.1}"
      RELEASE_ARGS="${GORELEASER_RELEASE_ARGS:---clean}"
      RELEASE_ARGS="$RELEASE_ARGS --config .goreleaser.yaml"

      echo "Running GoReleaser with: release $RELEASE_ARGS"

      docker run --rm --privileged \
        -v "$PWD:/workspace" \
        -w /workspace \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /root/.docker:/root/.docker \
        -e DOCKER_REGISTRY \
        -e DOCKER_USERNAME \
        -e DOCKER_PASSWORD \
        -e GITLAB_TOKEN \
        -e CI_JOB_TOKEN \
        -e CI_REGISTRY_IMAGE \
        -e CI_COMMIT_TAG \
        -e CI_COMMIT_BRANCH \
        -e CI_DEFAULT_BRANCH \
        -e CI_PROJECT_URL \
        -e CI_API_V4_URL \
        -e CI_PROJECT_ID \
        -e GITLAB_CI \
        -e DOCKERFILE=Dockerfile \
        "$GORELEASER_IMAGE" release $RELEASE_ARGS
