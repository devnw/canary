# Canary - golangci-lint configuration
# Minimal config for GitLab CI; expand linters as needed

version: "2"

run:
  timeout: 5m
  issues:
    exclude-rules:
      - linters:
          - staticcheck
        text: "could use tagged switch|deprecated|Use fmt.Fprintf"
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - devnw.dev/canary

linters:
  default: none
  enable:
    # errcheck disabled until test-file exclusions work; many unchecked errors fixed in non-test code
    - govet
    # gosec runs through golangci-lint so the repo's //nolint:gosec directives
    # are honored (standalone gosec ignores //nolint and reports every finding).
    - gosec
    - ineffassign
    # staticcheck disabled for style suggestions (QF1003/SA1019/QF1012); re-enable and fix later
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      # Standalone gosec does not scan _test.go files by default (-tests=false);
      # match that default so test-only permissions/error-handling patterns
      # (G104/G301/G306) don't fail the security scan.
      - path: _test\.go
        linters:
          - gosec
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

output:
  show-stats: true
