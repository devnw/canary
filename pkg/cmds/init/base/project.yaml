#    url: "https://github.com/owner/repo/issues/{num}"

# Peer projects: sibling repos consulted (read-only) to resolve requirement
# IDs this project doesn't own itself -- including IDs under a prefix not
# listed in sources: above. Each peer's own `canary scan --out status.json`
# is read from <root>/status.json; never written to.
# peers:
#   - name: platform-service
#     root: "../platform-service"
